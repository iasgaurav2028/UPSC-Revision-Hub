<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>UPSC Master Notes — Complete Syllabus</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!--
  STYLESHEET — index.html links only this ONE file. main.css
  internally @imports variables.css, layout.css, components.css,
  views.css, and responsive.css. To edit styles, open the relevant
  file inside css/ directly — you never need to touch this line.
-->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="app">
      <div class="overlay" id="overlay"></div>

      <div class="sidebar" id="sidebar">
        <div class="brand">
          <button class="close-drawer" id="closeDrawer" aria-label="Close menu">
            ✕
          </button>
          <div class="brand-eyebrow">UPSC Civil Services</div>
          <div class="brand-title">MASTER NOTES</div>
          <div class="brand-sub">COMPLETE SYLLABUS</div>
        </div>
        <div class="overall-progress">
          <div class="overall-progress-bar">
            <div
              class="overall-progress-fill"
              id="overallFill"
              style="width: 0%"
            ></div>
          </div>
          <div class="overall-progress-pct" id="overallPct">0%</div>
        </div>
        <div class="search-wrap">
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Search topics..."
          />
          <span class="search-icon">🔍</span>
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="sidebar-nav" id="sidebarNav"></div>
        <div class="tree-container" id="treeContainer"></div>
        <div class="sidebar-footer">GS 1–4 · ESSAY · FULL SYLLABUS</div>
      </div>

      <div class="main">
        <div class="topbar">
          <button class="menu-btn" id="menuBtn" aria-label="Open menu">
            ☰
          </button>
          <div class="topbar-title" id="topbarTitle">Dashboard</div>
          <button
            class="reading-mode-btn"
            id="readingModeBtn"
            title="Full-screen reading mode"
            aria-label="Toggle reading mode"
          >
            ⛶
          </button>
          <div class="topbar-tag">UPSC 2025–26</div>
        </div>
        <div class="notes-scroll">
          <div class="notes-content" id="notesContent"></div>
        </div>
        <div class="note-nav-fab-group" id="noteNavFabGroup">
          <button
            class="note-nav-fab note-nav-prev"
            id="noteNavPrevBtn"
            title="Previous topic"
            aria-label="Previous topic"
          >
            ◀
          </button>
          <button
            class="note-nav-fab note-nav-next"
            id="noteNavNextBtn"
            title="Next topic"
            aria-label="Next topic"
          >
            ▶
          </button>
        </div>
        <button
          class="exit-reading-btn"
          id="exitReadingBtn"
          title="Exit reading mode"
          aria-label="Exit reading mode"
        >
          ✕
        </button>
      </div>
    </div>

    <div class="chapter-complete-overlay" id="chapterCompleteOverlay">
      <div class="chapter-complete-card">
        <div class="chapter-complete-emoji">🎉</div>
        <div class="chapter-complete-title" id="chapterCompleteTitle">
          Congratulations!
        </div>
        <div class="chapter-complete-sub" id="chapterCompleteSub"></div>
        <div class="chapter-complete-actions">
          <button
            class="chapter-complete-hurrah-btn"
            id="chapterCompleteHurrahBtn"
          >
            Hurrah! 🎉
          </button>
          <button
            class="chapter-complete-close-btn"
            id="chapterCompleteCloseBtn"
          >
            Stay Here
          </button>
        </div>
      </div>
    </div>

    <div class="quiz-overlay" id="quizOverlay">
      <div class="quiz-modal">
        <div class="quiz-header">
          <div class="quiz-header-title" id="quizTitle">PRACTICE HUB</div>
          <button class="quiz-close" id="quizClose">✕</button>
        </div>
        <div class="quiz-progress-bar">
          <div
            class="quiz-progress-fill"
            id="quizProgressFill"
            style="width: 0%"
          ></div>
        </div>
        <div class="quiz-body" id="quizBody"></div>
        <div class="quiz-footer" id="quizFooter">
          <button class="quiz-nav-btn" id="quizPrevBtn">◀ Prev</button>
          <span class="quiz-score-label" id="quizScoreLabel"></span>
          <button class="quiz-nav-btn" id="quizNextBtn">Next ▶</button>
        </div>
      </div>
    </div>

    <!--
  SCRIPT — index.html links only this ONE file. bundle.js is small and
  fixed-cost: it holds the TREE_DATA "skeleton" (every topic's title/
  icon/hierarchy, used by the sidebar, search and navigation) plus the
  engine (6 modules: core, loader, tree, notes, practice, app).

  The heavy note bodies + quizzes are NOT in bundle.js — they live in
  files under js/content/ that mirror the js/data/ notes folder
  structure, and are loaded on demand (via js/engine/loader.js) the
  first time you open that topic. So the initial load stays fast no
  matter how many notes are added.

  Both bundle.js and js/content/*.js are generated by build-bundle.js —
  regenerate them any time you add/edit a chapter or quiz file:

      node build-bundle.js

  Never edit js/bundle.js or js/content/*.js directly; edit the source
  files under js/data/ (or js/engine/) and re-run the command above.
-->
    <script src="js/bundle.js"></script>
  </body>
</html>
